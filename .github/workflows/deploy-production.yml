name: Deploy to Production

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: motoreco-ecr-web-prod
  ECR_MIGRATION_REPOSITORY: motoreco-ecr-migration-prod
  ECS_CLUSTER: motoreco-ecs-cluster-prod
  ECS_SERVICE: motoreco-web-service-prod
  MIGRATION_TASK_DEFINITION: motoreco-migration-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # タグ名から/を-に置換してDockerタグとして有効な形式に変換
          IMAGE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')

          # バージョン番号の抽出 (release/1.0.0 → 1.0.0)
          APP_VERSION=$(echo "${{ github.ref_name }}" | sed 's/release\///')

          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.PROD_FIREBASE_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.PROD_FIREBASE_APP_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.PROD_FIREBASE_MEASUREMENT_ID }} \
            --build-arg APP_VERSION=$APP_VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Build and push migration image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')

          docker build -f packages/database/Dockerfile.migration \
            -t $ECR_REGISTRY/$ECR_MIGRATION_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_MIGRATION_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_MIGRATION_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_MIGRATION_REPOSITORY:latest

      - name: Run database migration
        run: |
          # Task Definition ARNの取得
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.MIGRATION_TASK_DEFINITION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          # Public SubnetとSecurity Groupの取得
          # CDKが自動生成するNameタグ (例: MotoRecoProductionStack/Network/PublicSubnetAz1) にマッチ
          PUBLIC_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=*PublicSubnet*" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr '\t' ',')

          FARGATE_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=motoreco-sg-fargate-prod" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          # マイグレーションTaskの実行
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition $TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$PUBLIC_SUBNETS],securityGroups=[$FARGATE_SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task started: $TASK_ARN"

          # Taskの完了待機
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN

          # 実行結果の確認
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code: $EXIT_CODE"

            # CloudWatch Logsからエラーログを取得
            LOG_STREAM=$(aws logs describe-log-streams \
              --log-group-name /ecs/motoreco-migration-prod \
              --order-by LastEventTime \
              --descending \
              --max-items 1 \
              --query 'logStreams[0].logStreamName' \
              --output text)

            if [ "$LOG_STREAM" != "None" ] && [ -n "$LOG_STREAM" ]; then
              echo "Migration logs:"
              aws logs get-log-events \
                --log-group-name /ecs/motoreco-migration-prod \
                --log-stream-name "$LOG_STREAM" \
                --query 'events[*].message' \
                --output text
            fi

            exit 1
          fi

          echo "Migration completed successfully"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Create PR to sync main with develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR作成失敗時もJobを成功させる（デプロイは成功しているため）
          set +e

          echo "=========================================="
          echo "Creating PR: develop → main"
          echo "=========================================="

          # リリースバージョンの抽出 (release/1.0.0 → 1.0.0)
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/release\///')
          echo "Release version: $VERSION"

          # 既存のPRをチェック
          EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number' 2>&1)

          if [ $? -ne 0 ]; then
            echo ""
            echo "⚠️  Warning: Failed to check existing PRs"
            echo "$EXISTING_PR"
            echo "Attempting to create PR anyway..."
          elif [ -n "$EXISTING_PR" ]; then
            echo ""
            echo "ℹ️  PR already exists: #$EXISTING_PR"
            echo "Skipping PR creation"
            echo ""
            echo "PR URL: https://github.com/${{ github.repository }}/pull/$EXISTING_PR"
            exit 0
          fi

          # develop と main の差分をチェック
          git fetch origin main develop

          MAIN_COMMIT=$(git rev-parse origin/main 2>&1)
          DEVELOP_COMMIT=$(git rev-parse origin/develop 2>&1)

          if [ $? -ne 0 ]; then
            echo ""
            echo "⚠️  Warning: Failed to fetch branch information"
            echo "Please create the sync PR manually:"
            echo "  gh pr create --base main --head develop"
            exit 0
          fi

          echo ""
          echo "Current state:"
          echo "  main:    $MAIN_COMMIT"
          echo "  develop: $DEVELOP_COMMIT"

          # 既に同期済みかチェック
          if [ "$MAIN_COMMIT" = "$DEVELOP_COMMIT" ]; then
            echo ""
            echo "✓ main and develop are already in sync"
            echo "No PR needed"
            exit 0
          fi

          # PRの作成
          echo ""
          echo "Creating pull request..."

          PR_TITLE="🚀 Sync main with develop (release/$VERSION)"
          PR_BODY="## デプロイ完了後の同期PR

          このPRは、\`release/$VERSION\` のデプロイ成功後に自動作成されました。

          ### 変更内容
          - develop ブランチの内容を main ブランチに同期します
          - リリースバージョン: \`$VERSION\`
          - デプロイ完了: ✅

          ### マージ方法
          1. 差分を確認してください
          2. 問題がなければ、このPRをマージしてください
          3. Fast-forward mergeが推奨されます

          ### 関連情報
          - デプロイワークフロー: [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - リリースタグ: \`${{ github.ref_name }}\`

          ---
          🤖 このPRは GitHub Actions により自動生成されました"

          PR_URL=$(gh pr create \
            --base main \
            --head develop \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "deployment,automated" \
            2>&1)

          if [ $? -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo "✓ PR created successfully"
            echo "=========================================="
            echo ""
            echo "$PR_URL"
            echo ""
            echo "Please review and merge the PR to complete the sync."
          else
            echo ""
            echo "=========================================="
            echo "⚠️  Warning: Failed to create PR"
            echo "=========================================="
            echo ""
            echo "$PR_URL"
            echo ""
            echo "Deployment was successful, but PR creation failed."
            echo "Please create the sync PR manually:"
            echo "  gh pr create --base main --head develop --title \"🚀 Sync main with develop (release/$VERSION)\""
            echo ""
            echo "Job will continue as successful since deployment completed."
          fi

          # PR作成失敗でもJobは成功させる
          exit 0
