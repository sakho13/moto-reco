name: Claude Code Review

# PRが開かれたとき・Ready になったときに、Claudeが自動でレビューしてPRにコメントする (#690)
# - 利用枠を抑えるため、push ごと（synchronize）には動かさない
# - code-review プラグインは Claude のコメントが既にあるPRをスキップするため、レビューは1PRにつき1回になる
#   更新後に見直してほしいときは PR に「@claude この差分をレビューして」とコメントする（claude.yml が応答する）
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # ドラフトとDependabotのPRは対象外（botが起点の実行はaction側でも拒否される）
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # インラインコメント用のMCPサーバーは --allowedTools に名前があるときだけ起動する
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "レビューコメントはすべて日本語で書くこと。CLAUDE.md と .claude/rules/ の規約に沿っているかも確認すること。"
