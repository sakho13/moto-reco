name: Every PR Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  lint-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          # Firebase Admin SDK用の環境変数（テスト用ダミー値）
          FIREBASE_PROJECT_ID=motoreco
          FIREBASE_CLIENT_EMAIL=motoreco@example.com
          FIREBASE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR=true
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR=true
          NEXT_PUBLIC_FIREBASE_API_KEY=12345678TPeQdHphdbGQ7oXXlP9_XXXXX_X_XXX
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=motoreco.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=motoreco
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=motoreco.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123111918999
          NEXT_PUBLIC_FIREBASE_APP_ID=1:111111111100:web:5635de580675ece78a5bb0
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-XXXXXXXXXX
          # Database用の環境変数
          DATABASE_URL="postgres://motoreco_user:motoreco_password@localhost:5432/motoreco_db"
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./package.json
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./
        run: pnpm install

      - name: Run lint
        working-directory: ./
        run: pnpm lint

      - name: Run builds
        working-directory: ./
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest

    environment:
      name: test

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: motoreco_user
          POSTGRES_PASSWORD: motoreco_password
          POSTGRES_DB: motoreco_db
          TZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # localstack:
      #   image: localstack/localstack:latest
      #   ports:
      #     - "4566:4566"
      #     - "4510-4559:4510-4559"
      #   env:
      #     SERVICES: s3,ssm,secretsmanager,events,sqs,lambda,sts,iam
      #     AWS_DEFAULT_REGION: us-east-1
      #     AWS_ACCESS_KEY_ID: test
      #     AWS_SECRET_ACCESS_KEY: test
      #     DEBUG: "1"
      #     LOCALSTACK_DATA_DIR: /var/lib/localstack
      #     LS_LOG: trace
      #     LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Copy test .env
        run: cp .env.local .env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./package.json
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./
        run: pnpm install

      - name: install firebase-tools
        run: |
          npm install -g firebase-tools@14.7.0

      - name: Set up database
        run: |
          pnpm turbo db:generate
          pnpm turbo db:migrate
          pnpm turbo db:seed

      - name: Start Firebase Emulator (バックグラウンド)
        working-directory: ./development/firebase_emulator
        run: |
          npx firebase emulators:start \
            --only auth \
            --project motoreco \
            --import ./init-data \
            --export-on-exit &
          npx wait-on tcp:9099 tcp:4000

      - name: Run tests
        working-directory: ./
        run: pnpm test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: test

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: motoreco_user
          POSTGRES_PASSWORD: motoreco_password
          POSTGRES_DB: motoreco_db
          TZ: Asia/Tokyo
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          # Firebase Admin SDK用の環境変数（テスト用ダミー値）
          FIREBASE_PROJECT_ID=motoreco
          FIREBASE_CLIENT_EMAIL=motoreco@example.com
          FIREBASE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR=true
          NEXT_PUBLIC_FIREBASE_API_KEY=12345678TPeQdHphdbGQ7oXXlP9_XXXXX_X_XXX
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=motoreco.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=motoreco
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=motoreco.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123111918999
          NEXT_PUBLIC_FIREBASE_APP_ID=1:111111111100:web:5635de580675ece78a5bb0
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-XXXXXXXXXX
          # Database用の環境変数
          DATABASE_URL="postgres://motoreco_user:motoreco_password@localhost:5432/motoreco_db"
          # Playwright用の環境変数
          FIREBASE_AUTH_EMULATOR_URL=http://localhost:9099
          PLAYWRIGHT_BASE_URL=http://localhost:3333
          EOF

      - name: Copy .env to web app
        run: cp .env apps/web/.env.local

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./package.json
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./
        run: pnpm install

      - name: Install Playwright browsers
        working-directory: ./apps/e2e
        run: npx playwright install --with-deps chromium

      - name: install firebase-tools
        run: |
          npm install -g firebase-tools@14.7.0

      - name: Set up database
        run: |
          pnpm turbo db:generate
          pnpm turbo db:migrate
          pnpm turbo db:seed

      - name: Start Firebase Emulator (バックグラウンド)
        working-directory: ./development/firebase_emulator
        run: |
          npx firebase emulators:start \
            --only auth \
            --project motoreco \
            --import ./init-data \
            --export-on-exit &
          npx wait-on tcp:9099 tcp:4000

      - name: Start web server (バックグラウンド)
        working-directory: ./apps/web
        env:
          WEB_PORT: '3333'
        run: |
          pnpm dev > /tmp/next-dev.log 2>&1 &
          npx wait-on http://localhost:3333 --timeout 120000 || (cat /tmp/next-dev.log && exit 1)

      - name: Run E2E tests
        working-directory: ./apps/e2e
        run: |
          set -a; source ../../.env; set +a
          pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
