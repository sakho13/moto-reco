name: Claude Code

# Issue / PR で @claude とメンションしたときに応答する
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude が PR の CI 結果を読むために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Claude が lint / 型チェックで自分の変更を検証できるように依存関係を入れておく
      # (.claude/settings.json の Stop フック `pnpm format` もこれがないと失敗する)
      - name: Install pnpm
        run: npm install -g pnpm@11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./package.json
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: Copy local .env
        run: cp .env.local .env

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm turbo db:generate

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # DB や Firebase Emulator は起動していないため、pnpm test / build は許可していない
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(pnpm lint),Bash(pnpm lint:*),Bash(pnpm check-types),Bash(pnpm check-types:*),Bash(pnpm format),Bash(pnpm turbo db:generate),Bash(git diff:*),Bash(git log:*),Bash(git status)"
