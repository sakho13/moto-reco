components:
  headers:
    Authorization:
      description: Bearerトークンを指定します。
      example: Bearer your_token_here
      required: true
      schema:
        type: string

  schemas:
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 50
    UserUpdateProfile:
      type: object
      description: 少なくとも1フィールドの指定が必須
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名（1-50文字）
        notificationEmail:
          type: string
          format: email
          nullable: true
          description: 通知用メールアドレス（nullで削除）
    UserRegister:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: ユーザー名（1-50文字）
    UserQuit:
      type: object
      required:
        - quitReason
      properties:
        quitReason:
          type: string
          minLength: 1
          maxLength: 200
          description: 退会理由（1-200文字）
    UserQuitResponse:
      type: object
      properties:
        recoveryCode:
          type: string
          example: '12345'
    UserRecover:
      type: object
      required:
        - recoveryCode
      properties:
        recoveryCode:
          type: string
          minLength: 5
          maxLength: 5
          description: 復帰コード（5桁）
          example: '12345'
    UserRecoverResponse:
      type: object
      properties:
        userId:
          type: string
    ManufacturerDetail:
      type: object
      properties:
        manufacturerId:
          type: string
        name:
          type: string
        nameEn:
          type: string
        country:
          type: string
    BikeDetail:
      type: object
      properties:
        bikeId:
          type: string
        manufacturerId:
          type: string
        manufacturer:
          type: string
        modelName:
          type: string
        displacement:
          type: number
          format: float
          description: 排気量（cc）
        modelYear:
          type: integer
          description: モデル公開年
    UserBikeDetail:
      type: object
      properties:
        userBikeId:
          type: string
        myUserBikeId:
          type: string
        manufacturerName:
          type: string
          nullable: true
        bikeId:
          type: string
          nullable: true
        modelName:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
          default: null
          maxLength: 50
        purchaseDate:
          type: string
          description: 購入日（ISO 8601形式）
          nullable: true
        purchasePrice:
          type: integer
          description: 購入価格（円）
          nullable: true
        purchaseMileage:
          type: integer
          description: 購入時走行距離（km）
          nullable: true
        totalMileage:
          type: integer
          description: 総走行距離（km）
          nullable: true
          default: 0
        displacement:
          type: number
          format: float
          description: 排気量（cc）
        modelYear:
          type: integer
          description: モデル公開年
          nullable: true
          example: 2025
        createdAt:
          type: string
          description: 登録日時（ISO 8601形式）
        updatedAt:
          type: string
          description: 最終更新日時（ISO 8601形式）
    UserBikeRegisterDetail:
      type: object
      anyOf:
        - required:
            - bikeId
        - required:
            - displacement
      properties:
        bikeId:
          type: string
          nullable: true
        displacement:
          type: number
          format: float
          description: 排気量（cc）。bikeId未指定の場合は必須。
        serialNumber:
          type: string
          nullable: true
          maxLength: 100
        nickname:
          type: string
          nullable: true
          default: null
          maxLength: 50
        purchaseDate:
          type: string
          format: date-time
          description: 購入日（ISO 8601形式）
          nullable: true
        purchasePrice:
          type: integer
          description: 購入価格（円）
          nullable: true
        purchaseMileage:
          type: integer
          description: 購入時走行距離（km）
          nullable: true
        totalMileage:
          type: integer
          description: 総走行距離（km）
          nullable: true
          default: 0
    UserBikeUpdateDetail:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          default: null
          maxLength: 50
        purchaseDate:
          type: string
          description: 購入日（ISO 8601形式）
          nullable: true
        purchaseMileage:
          type: integer
          description: 購入時走行距離（km）
          nullable: true
        purchasePrice:
          type: integer
          description: 購入価格（円）
          nullable: true
        totalMileage:
          type: integer
          description: 総走行距離（km）
          nullable: true
          default: 0
