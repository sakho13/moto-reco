    MyUserBikeTouringSpotDetail:
      type: object
      properties:
        spotId:
          type: string
        touringId:
          type: string
        type:
          type: string
          enum:
            - SPOT
            - BREAK
          description: スポット種別（SPOT=観光地など、BREAK=休憩）
        name:
          type: string
          nullable: true
          maxLength: 100
          description: スポット名
        memo:
          type: string
          nullable: true
          maxLength: 500
          description: メモ
        latitude:
          type: number
          format: float
          nullable: true
          description: 緯度
        longitude:
          type: number
          format: float
          nullable: true
          description: 経度
        visitedAt:
          type: string
          description: 訪問日時（ISO 8601形式）
        endAt:
          type: string
          nullable: true
          description: 終了日時（ISO 8601形式）
        sortOrder:
          type: integer
          description: 並び順

    MyUserBikeTouringSpotRegisterDetail:
      type: object
      properties:
        type:
          type: string
          enum:
            - SPOT
            - BREAK
          default: SPOT
          description: スポット種別
        name:
          type: string
          maxLength: 100
          description: スポット名
        memo:
          type: string
          maxLength: 500
          description: メモ
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: 緯度
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: 経度
        visitedAt:
          type: string
          description: 訪問日時（ISO 8601形式）
        endAt:
          type: string
          description: 終了日時（ISO 8601形式）

    MyUserBikeTouringSpotUpdateDetail:
      type: object
      description: いずれかのフィールドの指定が必須
      properties:
        name:
          type: string
          maxLength: 100
          nullable: true
          description: スポット名
        memo:
          type: string
          maxLength: 500
          nullable: true
          description: メモ
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: 緯度
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: 経度
        visitedAt:
          type: string
          description: 訪問日時（ISO 8601形式）
        endAt:
          type: string
          nullable: true
          description: 終了日時（ISO 8601形式）

    MyUserBikeTouringSpotReorderDetail:
      type: object
      required:
        - spotIds
      properties:
        spotIds:
          type: array
          items:
            type: string
          minItems: 1
          description: 並び替え後のスポットIDの順序

    PhotoDetail:
      type: object
      properties:
        photoId:
          type: string
        photoUrl:
          type: string
          description: 読み取り用の署名付きURL（有効期限あり）
        storagePath:
          type: string
          description: Firebase Storage上のパス
        memo:
          type: string
          nullable: true
        takenAt:
          type: string
          format: date-time
          description: 撮影日時（ISO 8601形式）

    UserPhotoDetail:
      allOf:
        - $ref: '#/components/schemas/PhotoDetail'
        - type: object
          properties:
            attachments:
              type: array
              description: ツーリング/スポット/バイクいずれの紐づけかを表す一覧
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [TOURING, SPOT, BIKE]
                  touringId:
                    type: string
                  spotId:
                    type: string
                  myUserBikeId:
                    type: string

    PhotoUploadUrlRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required:
              - contentType
              - fileName
              - fileSize
            properties:
              contentType:
                type: string
                enum: [image/jpeg, image/png, image/webp]
              fileName:
                type: string
              fileSize:
                type: integer
                minimum: 1

    PhotoUploadUrlItem:
      type: object
      properties:
        signedUploadUrl:
          type: string
          description: 書き込み用の署名付きURL（有効期限15分）
        photoPath:
          type: string
          description: Firebase Storage上のアップロード先パス
        uploadMethod:
          type: string
          enum: [PUT, POST]
          description: アップロード先へのHTTPメソッド（Storage Emulatorではuploadタイプの制約によりPOSTになる）

    PhotoRegisterRequest:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          maxItems: 10
          items:
            type: object
            required:
              - photoPath
              - takenAt
            properties:
              photoPath:
                type: string
                description: upload-urlで発行したphotoPath（自分のユーザーパス配下のみ許可）
              takenAt:
                type: string
                format: date-time
                description: 撮影日時（ISO 8601形式）
              memo:
                type: string
                nullable: true
                maxLength: 500

    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - VALIDATION_ERROR
        - AUTH_FAILED
        - FORBIDDEN
        - USER_NOT_REGISTERED
        - GUEST_EXPIRED
        - NOT_FOUND
        - SERVER_ERROR

    MaintenanceType:
      type: string
      enum:
        # ブレーキ装置
        - BRAKE_FLUID
        - FRONT_BRAKE_PAD
        - REAR_BRAKE_PAD
        - MASTER_CYLINDER_CUP
        - BRAKE_CALIPER_SEAL
        - BRAKE_CABLE
        # エンジン
        - SPARK_PLUG
        - COOLANT
        - ENGINE_OIL
        - OIL_CLEANER
        # 動力伝達装置
        - TRANSMISSION_OIL
        - DRIVE_CHAIN
        - DRIVE_BELT
        # タイヤ
        - FRONT_TIRE
        - REAR_TIRE
        # 電気装置
        - BATTERY
        - LIGHT
        - TURN_SIGNAL
        - HORN

  responses:
    Error400:
      description: 不正なリクエスト
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: 認証失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: ユーザー未登録
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
