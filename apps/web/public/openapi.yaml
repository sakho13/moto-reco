openapi: 3.0.0
info:
  title: MotoReco API Documentation
  version: 0.0.1

servers:
  - url: http://localhost:3002
    description: ローカル開発環境

tags:
  - name: user
    description: ユーザー情報関連のAPI
  - name: bikes
    description: バイク情報関連のAPI
  - name: user-bikes
    description: ユーザー所有バイク関連のAPI
  - name: photos
    description: 写真関連のAPI

paths:
  /api/v1/user/profile:
    get:
      summary: ユーザプロフィールの取得
      tags:
        - user
      responses:
        '200':
          description: プロフィール取得成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
                    example: プロフィール取得成功
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      summary: ユーザプロフィールの部分更新
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateProfile'
      responses:
        '200':
          description: プロフィール更新成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
                    example: プロフィール更新成功
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/user/auth/register:
    post:
      summary: ユーザー登録（新規登録または既存ユーザー取得）
      description: Firebase認証後の初回登録エンドポイント。既にMAuthProviderにレコードが存在する場合は既存ユーザー情報を返却します。
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: ユーザー登録成功（新規作成または既存ユーザー）
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
                    example: ユーザー登録成功
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/user/auth/quit:
    post:
      summary: ユーザー退会
      description: 退会理由を受け取り、退会処理後に復帰コードを返却します。
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuit'
      responses:
        '200':
          description: 退会処理成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserQuitResponse'
                  message:
                    type: string
                    example: 退会処理が完了しました
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/user/auth/recover:
    post:
      summary: ユーザー復帰
      description: 復帰コードを受け取り、退会状態のユーザーを復帰させます。
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRecover'
      responses:
        '200':
          description: 復帰処理成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserRecoverResponse'
                  message:
                    type: string
                    example: 復帰処理が完了しました
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/bikes/manufacturers:
    get:
      summary: バイクメーカー一覧の取得
      tags:
        - bikes
      responses:
        '200':
          description: メーカー一覧取得成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      manufacturers:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManufacturerDetail'
                  message:
                    type: string
                    example: メーカー一覧取得成功
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/bikes/search:
    get:
      summary: 登録可能なバイクの検索
      tags:
        - bikes
      parameters:
        - in: query
          name: mf-op
          schema:
            type: string
            enum:
              - eq
              - ne
              - in
        - in: query
          name: mf
          schema:
            type: string
            description: バイクメーカーID（複数指定可能、カンマ区切り、 `mf-op`で指定したオペレーターに従う）
        - in: query
          name: model-name
          schema:
            type: string
            description: モデル名（部分一致検索）
        - in: query
          name: displacement-min
          schema:
            type: integer
            description: 排気量の最小値（cc）
        - in: query
          name: displacement-max
          schema:
            type: integer
            description: 排気量の最大値（cc）
        - in: query
          name: model-year-min
          schema:
            type: integer
            description: モデル公開年の最小値
        - in: query
          name: model-year-max
          schema:
            type: integer
            description: モデル公開年の最大値
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            description: ページ番号（1始まり）
        - in: query
          name: per-size
          schema:
            type: integer
            default: 20
            maximum: 100
            description: 1ページあたりの件数
        - in: query
          name: sort-by
          schema:
            type: string
            enum:
              - model-year
              - displacement
              - modelYear
            description: ソート対象のフィールド
        - in: query
          name: sort-order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
            description: ソート順序
      responses:
        '200':
          description: バイク検索成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      bikes:
                        type: array
                        items:
                          $ref: '#/components/schemas/BikeDetail'
                  message:
                    type: string
                    example: バイク検索成功
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /api/v1/user-bike/register:
    post:
      summary: マイユーザーバイクの登録
      tags:
        - user-bikes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBikeRegisterDetail'
      responses:
        '201':
          description: ユーザー所有バイク登録成功
          headers:
            Authorization:
              $ref: '#/components/headers/Authorization'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserBikeDetail'
                  message:
